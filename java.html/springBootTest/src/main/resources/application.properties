spring.application.name=springBootTest
spring.profiles.active=dev
# 关闭 devtools 自动覆盖（避免它把 server.port 改成随机端口）
spring.devtools.add-properties=false
# 日志级别
logging.level.root=info
logging.level.com.fenglin.springboottest=info
# 日志文件位置
logging.file.name=log/xx.log
# 控制台日志格式
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss}  %level %logger{50}.%M %L:%m%n
# 文件日志格式
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss}  %level %logger{50}.%M %L:%m%n