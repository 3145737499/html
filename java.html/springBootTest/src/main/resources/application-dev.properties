server.port=9090

# ============ 数据源（MySQL） ============
spring.datasource.url=jdbc:mysql://localhost:3306/boonie?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_general_ci&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============ MyBatis-Plus ============
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.global-config.db-config.id-type=auto
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

# ============ 邮件（QQ 邮箱 SMTP） ============
# 发送方 QQ 邮箱（例如 123456@qq.com）
spring.mail.host=smtp.qq.com
spring.mail.port=587
spring.mail.username=
# 注意：不是 QQ 登录密码，而是「QQ 邮箱 → 设置 → 账户 → 开启 SMTP 服务」后生成的【授权码】
spring.mail.password=
spring.mail.protocol=smtp
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.socketFactory.port=587
# 收件人看到的发件人名称
app.mail.from-name=熊出没社区
